<div class="contact-container">
    <h2>Get In Touch</h2>
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
    <input formControlName="name" placeholder="Name">
    <input formControlName="email" placeholder="E-Mail">
    <input formControlName="subject" placeholder="Subject">
    <textarea formControlName="message" placeholder="Message"></textarea>
    <button type="submit">Submit</button>
</form>

@if(submitted){
    <p class="success-message">Thank you! Your message has been sent.</p>
}
